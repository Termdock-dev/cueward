[package]
name = "cueward-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "macOS CLI that gives AI agents local memory and computer use: read native app data and files, and operate background windows."
keywords = ["macos", "automation", "ai-agents", "computer-use", "accessibility"]
categories = ["command-line-utilities", "os::macos-apis"]

[[bin]]
name = "cueward"
path = "src/main.rs"

[dependencies]
cueward-core = { workspace = true }
cueward-adapter-macos = { workspace = true }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
