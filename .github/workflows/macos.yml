name: macOS checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting of changed Rust files
        run: python3 scripts/check-rust-format.py --base "$BASE_SHA"
      - name: Build release
        run: cargo build --release --locked
      - name: Run tests without opt-in desktop or live App tests
        run: cargo test --workspace --locked -- --test-threads=1
